<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shubh Diwali 3D Mela - Free Crackers & Boutique</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; background: #05020c; touch-action: none; }
    #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; inset: 0; }
    
    /* Top HUD */
    #hud {
      position: absolute; top: 16px; left: 16px; color: #ffdf79;
      background: linear-gradient(135deg, rgba(30, 10, 45, 0.92), rgba(12, 4, 20, 0.95));
      padding: 14px 20px; border-radius: 16px; border: 2px solid #ffd700;
      box-shadow: 0 8px 30px rgba(255, 170, 0, 0.35); pointer-events: none; z-index: 20;
    }
    #hud h2 { margin: 0 0 4px 0; font-size: 17px; color: #ffe682; letter-spacing: 1px; }
    #hud p { margin: 2px 0; font-size: 13px; color: #fff; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-weight: bold; background: #15803d; color: #bbf7d0; font-size: 11px; }

    /* On-Screen Cracker Action Bar (Burn & Throw Anywhere) */
    #cracker-action-bar {
      position: absolute; bottom: 80px; right: 20px;
      display: flex; flex-direction: column; gap: 8px; z-index: 25;
    }
    .action-btn {
      background: linear-gradient(135deg, #b91c1c, #ea580c); color: #fff;
      border: 2px solid #ffd700; padding: 10px 16px; border-radius: 20px;
      font-size: 13px; font-weight: bold; cursor: pointer; transition: transform 0.1s;
      box-shadow: 0 4px 15px rgba(234, 88, 12, 0.6); display: flex; align-items: center; gap: 6px;
    }
    .action-btn:hover { transform: scale(1.06); background: linear-gradient(135deg, #ea580c, #f59e0b); }
    .action-btn.throw { background: linear-gradient(135deg, #4338ca, #6366f1); border-color: #a5b4fc; }

    /* Bottom Greeting Bar */
    #greeting-bar {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; background: rgba(20, 8, 30, 0.94);
      padding: 8px 16px; border-radius: 40px; border: 2px solid #ffd700;
      box-shadow: 0 4px 30px rgba(255, 120, 0, 0.5); z-index: 20; max-width: 95vw; overflow-x: auto;
    }
    .greet-btn {
      background: linear-gradient(135deg, #d9530f, #ff7e26); color: #fff;
      border: 1px solid #ffe285; padding: 8px 14px; border-radius: 20px;
      font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.15s ease-in-out; white-space: nowrap;
    }
    .greet-btn:hover { transform: scale(1.06) translateY(-2px); background: linear-gradient(135deg, #ff7e26, #ffd000); color: #220500; }

    /* Touch Joystick for Mobile */
    #mobile-controls {
      position: absolute; bottom: 85px; left: 24px; width: 110px; height: 110px;
      background: rgba(255, 255, 255, 0.12); border: 2px dashed rgba(255, 215, 0, 0.5);
      border-radius: 50%; z-index: 20; display: none; touch-action: none;
    }
    #joystick-knob {
      position: absolute; top: 32px; left: 32px; width: 46px; height: 46px;
      background: radial-gradient(circle, #ff8533 0%, #b91c1c 100%);
      border-radius: 50%; border: 2px solid #ffd700; box-shadow: 0 0 15px rgba(255, 120, 0, 0.8);
      pointer-events: none;
    }

    /* Interaction Prompt Banner */
    #interaction-prompt {
      position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(90deg, #b91c1c, #ea580c); color: #fff;
      padding: 10px 28px; font-size: 15px; font-weight: bold; border-radius: 30px;
      display: none; border: 2px solid #ffea79; box-shadow: 0 0 25px rgba(234, 88, 12, 0.8);
      z-index: 25; pointer-events: auto; cursor: pointer; text-align: center;
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.06); } }

    /* Dismount Ride Button */
    #dismount-btn {
      position: absolute; top: 85px; right: 20px;
      background: linear-gradient(135deg, #b91c1c, #ef4444); color: #fff;
      border: 2px solid #ffd700; padding: 12px 22px; border-radius: 30px;
      font-size: 14px; font-weight: bold; cursor: pointer; display: none; z-index: 30;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
    }

    /* Spawn / Entry Card */
    #spawn-screen {
      position: absolute; inset: 0; background: radial-gradient(circle, rgba(22,9,38,0.96) 0%, rgba(5,2,10,0.99) 100%);
      display: flex; justify-content: center; align-items: center; z-index: 200;
    }
    .spawn-card {
      background: linear-gradient(145deg, #2a1440, #140722); border: 2px solid #ffd700;
      border-radius: 20px; padding: 30px 24px; width: 340px; text-align: center; color: #fff;
      box-shadow: 0 0 50px rgba(255, 170, 0, 0.4);
    }
    .spawn-card input {
      width: 90%; padding: 10px; margin: 12px 0 18px 0; border-radius: 8px;
      border: 1px solid #ffd700; background: #0c0416; color: #fff; font-size: 15px; text-align: center;
    }
    .spawn-card button {
      background: linear-gradient(45deg, #ea580c, #f59e0b); color: #fff;
      border: none; padding: 11px 22px; border-radius: 8px; font-size: 15px;
      font-weight: bold; cursor: pointer; width: 95%;
    }

    /* Modals */
    .modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #1c0e30; color: #fff; border: 2px solid #ffd700;
      padding: 22px; border-radius: 16px; display: none; z-index: 100;
      box-shadow: 0 0 45px rgba(0,0,0,0.9); min-width: 320px; text-align: center;
    }
    .modal button {
      background: #ea580c; color: #fff; border: none; padding: 9px 16px;
      margin: 5px 4px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .modal button:hover { background: #f59e0b; color: #000; }
    .close-modal { background: #4b5563 !important; }
  </style>

  <!-- Three.js + Postprocessing + Physics -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Spawn Modal -->
  <div id="spawn-screen">
    <div class="spawn-card">
      <h2 style="color: #ffd700; margin-top: 0;">🪔 Shubh Diwali Mela</h2>
      <p style="font-size: 13px; color: #d1d5db;">All crackers and traditional outfits are 100% free! Burn, place or throw anywhere.</p>
      <input type="text" id="username-input" placeholder="Enter Your Name" maxlength="14" />
      <button onclick="joinMela()">Enter Free Grand Mela ✨</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <h2>🪔 SHUBH DIWALI MELA</h2>
    <p>👤 Player: <b id="display-name">-</b></p>
    <p>🟢 Live In Mela: <span class="badge" id="online-count">1 Online</span></p>
    <p>🎁 Festive Pass: <b style="color:#86efac;">100% Free Access</b></p>
    <p>👗 Kurta: <span id="kurta-name" style="color:#ffd700;">Royal Saffron</span></p>
    <p>🎡 Ride State: <b id="ride-state" style="color:#ffd700;">On Foot</b></p>
  </div>

  <!-- Throw & Place Cracker Action Bar -->
  <div id="cracker-action-bar" style="display: none;">
    <button class="action-btn throw" onclick="throwBomb()">💣 Throw Sutli Bomb!</button>
    <button class="action-btn" onclick="burnHere('rocket')">🚀 Shoot Sky Rocket</button>
    <button class="action-btn" onclick="burnHere('chakri')">🌀 Spin Chakri Here</button>
    <button class="action-btn" onclick="burnHere('anar')">🌋 Place Anar Here</button>
  </div>

  <button id="dismount-btn" onclick="dismountCurrentRide()">🚪 Dismount Ride (Exit Jhoola)</button>

  <div id="mobile-controls">
    <div id="joystick-knob"></div>
  </div>

  <div id="greeting-bar" style="display: none;">
    <button class="greet-btn" onclick="sendGreeting('🙏 Namaste!')">🙏 Namaste!</button>
    <button class="greet-btn" onclick="sendGreeting('🪔 Happy Diwali!')">🪔 Happy Diwali!</button>
    <button class="greet-btn" onclick="sendGreeting('🍬 Mithai Khao!')">🍬 Mithai Khao!</button>
    <button class="greet-btn" onclick="sendGreeting('✨ Ram Ram Ji!')">✨ Ram Ram Ji!</button>
  </div>

  <div id="interaction-prompt">Press [E] to Interact</div>

  <div id="action-modal" class="modal">
    <h3 id="modal-title" style="color:#ffd700; margin-top:0;">Action</h3>
    <div id="modal-body"></div>
    <br>
    <button class="close-modal" onclick="closeModal()">Close</button>
  </div>

  <script>
    /* =========================================================================
       1. CANNON-ES 3D PHYSICS WORLD
       ========================================================================= */
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);
    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    world.addBody(groundBody);

    /* =========================================================================
       2. THREE.JS SCENE SETUP & UNREAL BLOOM
       ========================================================================= */
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060210, 0.016);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const renderScene = new THREE.RenderPass(scene, camera);
    const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.8);
    const composer = new THREE.EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    scene.add(new THREE.AmbientLight(0x381f4a, 1.4));
    const moon = new THREE.DirectionalLight(0x758bb8, 0.7);
    moon.position.set(30, 60, 30);
    moon.castShadow = true;
    scene.add(moon);

    /* =========================================================================
       3. ORBIT CAMERA RIG
       ========================================================================= */
    const CameraOrbit = {
      theta: 0.78, phi: 0.65, radius: 17, isDragging: false, lastX: 0, lastY: 0
    };

    const container = document.getElementById('canvas-container');
    container.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#mobile-controls') || e.target.closest('#hud') || e.target.closest('#greeting-bar') || e.target.closest('#dismount-btn') || e.target.closest('#cracker-action-bar')) return;
      CameraOrbit.isDragging = true;
      CameraOrbit.lastX = e.clientX;
      CameraOrbit.lastY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!CameraOrbit.isDragging) return;
      const dx = e.clientX - CameraOrbit.lastX;
      const dy = e.clientY - CameraOrbit.lastY;
      CameraOrbit.lastX = e.clientX;
      CameraOrbit.lastY = e.clientY;

      CameraOrbit.theta -= dx * 0.007;
      CameraOrbit.phi = Math.max(0.15, Math.min(Math.PI / 2.1, CameraOrbit.phi + dy * 0.006));
    });

    window.addEventListener('pointerup', () => { CameraOrbit.isDragging = false; });
    window.addEventListener('pointercancel', () => { CameraOrbit.isDragging = false; });
    window.addEventListener('wheel', (e) => {
      CameraOrbit.radius = Math.max(7, Math.min(32, CameraOrbit.radius + e.deltaY * 0.02));
    }, { passive: true });

    /* =========================================================================
       4. FESTIVE ENVIRONMENT: GROUND, PATHS & DIYAS
       ========================================================================= */
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(160, 160),
      new THREE.MeshStandardMaterial({ color: 0x160c22, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const pathMat = new THREE.MeshStandardMaterial({ color: 0x421d28, roughness: 0.7 });
    const mainPath = new THREE.Mesh(new THREE.PlaneGeometry(12, 120), pathMat);
    mainPath.rotation.x = -Math.PI / 2;
    mainPath.position.y = 0.02;
    scene.add(mainPath);

    const crossPath = new THREE.Mesh(new THREE.PlaneGeometry(120, 12), pathMat);
    crossPath.rotation.x = -Math.PI / 2;
    crossPath.position.y = 0.02;
    scene.add(crossPath);

    // Center Rangoli
    function createRangoliTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ff8800'; ctx.beginPath(); ctx.arc(256, 256, 240, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b91c1c'; ctx.beginPath(); ctx.arc(256, 256, 190, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(256, 256, 120, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(256, 256, 45, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 16; i++) {
        const rad = (i * Math.PI) / 8;
        ctx.fillStyle = '#10b981'; ctx.beginPath();
        ctx.arc(256 + Math.cos(rad) * 155, 256 + Math.sin(rad) * 155, 18, 0, Math.PI * 2); ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }
    const rangoli = new THREE.Mesh(
      new THREE.PlaneGeometry(14, 14),
      new THREE.MeshBasicMaterial({ map: createRangoliTexture(), transparent: true })
    );
    rangoli.rotation.x = -Math.PI / 2;
    rangoli.position.set(0, 0.05, 0);
    scene.add(rangoli);

    // Street Diyas
    const interactiveDiyas = [];
    for (let i = -35; i <= 35; i += 7) {
      if (Math.abs(i) > 6) {
        [[-6.5, i], [6.5, i], [i, -6.5], [i, 6.5]].forEach(([x, z]) => {
          const diya = new THREE.Group();
          diya.position.set(x, 0.06, z);
          const base = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.12, 0.14, 10), new THREE.MeshStandardMaterial({ color: 0x9a3412 }));
          diya.add(base);
          const flame = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
          flame.position.y = 0.14; diya.add(flame);
          const pl = new THREE.PointLight(0xff7700, 1.2, 7);
          pl.position.y = 0.25; diya.add(pl);
          scene.add(diya);
          interactiveDiyas.push({ group: diya, flame, pl, offset: Math.random() * 10 });
        });
      }
    }

    // Overhead Lights
    const fairyColors = [0xff2200, 0xffd700, 0x00ffcc, 0xff00aa, 0x00ff44];
    for (let z = -20; z <= 20; z += 10) {
      for (let x = -26; x <= 26; x += 3.5) {
        const bulb = new THREE.Mesh(
          new THREE.SphereGeometry(0.12, 8, 8),
          new THREE.MeshBasicMaterial({ color: fairyColors[Math.abs(x * 3 + z) % fairyColors.length] })
        );
        bulb.position.set(x, 6.2 + Math.sin(x * 0.25) * 0.5, z);
        scene.add(bulb);
      }
    }

    /* =========================================================================
       5. DETAILED PATAKHA SHOP WITH FULL SHELF DISPLAYS
       ========================================================================= */
    const patakhaShop = new THREE.Group();
    patakhaShop.position.set(-18, 0, -5);

    // Shop Canopy & Desk
    const pCanopy = new THREE.Mesh(new THREE.ConeGeometry(4.2, 2.2, 4), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
    pCanopy.position.y = 5.2; pCanopy.rotation.y = Math.PI / 4; patakhaShop.add(pCanopy);

    const pDesk = new THREE.Mesh(new THREE.BoxGeometry(5.2, 1.4, 1.8), new THREE.MeshStandardMaterial({ color: 0x78350f }));
    pDesk.position.set(0, 0.7, 1.2); patakhaShop.add(pDesk);

    // Multi-tier Shelf Behind Counter
    const shelfBack = new THREE.Mesh(new THREE.BoxGeometry(4.8, 3.2, 0.4), new THREE.MeshStandardMaterial({ color: 0x451a03 }));
    shelfBack.position.set(0, 2.2, -0.6); patakhaShop.add(shelfBack);

    // Display Crackers: Red Sutli Bomb stacks, Green Chakri boxes, Gold Anars
    for (let row = 0; row < 3; row++) {
      const shelfY = 1.2 + row * 1.0;
      const shelfPlank = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.08, 0.8), new THREE.MeshStandardMaterial({ color: 0x78350f }));
      shelfPlank.position.set(0, shelfY, -0.2); patakhaShop.add(shelfPlank);

      for (let col = -1.8; col <= 1.8; col += 0.8) {
        if (row === 0) {
          // Cracker Boxes (Ladi / Cartons)
          const box = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.5), new THREE.MeshStandardMaterial({ color: 0xb91c1c }));
          box.position.set(col, shelfY + 0.24, -0.2); patakhaShop.add(box);
        } else if (row === 1) {
          // Conical Anar Displays
          const anarCone = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.5, 8), new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.6 }));
          anarCone.position.set(col, shelfY + 0.28, -0.2); patakhaShop.add(anarCone);
        } else {
          // Rocket Bundles
          const rktBundle = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.7, 8), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
          rktBundle.position.set(col, shelfY + 0.38, -0.2); patakhaShop.add(rktBundle);
        }
      }
    }

    // Counter Display Props
    const counterTray = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 0.8), new THREE.MeshStandardMaterial({ color: 0xd4af37 }));
    counterTray.position.set(-1.2, 1.45, 1.2); patakhaShop.add(counterTray);

    // Glowing Neon Sign
    function createBanner(text, bgCol = '#831843') {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bgCol; ctx.fillRect(0,0,512,128);
      ctx.lineWidth = 6; ctx.strokeStyle = '#ffd700'; ctx.strokeRect(4,4,504,120);
      ctx.fillStyle = '#ffea79'; ctx.font = 'bold 36px Segoe UI'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 64);
      return new THREE.CanvasTexture(c);
    }
    const patakhaBanner = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.5), new THREE.MeshBasicMaterial({ map: createBanner("🎆 Free Patakha Bhandar", '#991b1b'), transparent: true }));
    patakhaBanner.position.set(0, 6.2, 0); patakhaShop.add(patakhaBanner);
    scene.add(patakhaShop);

    /* =========================================================================
       6. KURTA-PYJAMA & TRADITIONAL DRESS BOUTIQUE
       ========================================================================= */
    const kurtaShop = new THREE.Group();
    kurtaShop.position.set(-18, 0, 15);

    const kCanopy = new THREE.Mesh(new THREE.ConeGeometry(4.2, 2.2, 4), new THREE.MeshStandardMaterial({ color: 0x7c3aed }));
    kCanopy.position.y = 5.2; kCanopy.rotation.y = Math.PI / 4; kurtaShop.add(kCanopy);

    const kDesk = new THREE.Mesh(new THREE.BoxGeometry(5.2, 1.4, 1.6), new THREE.MeshStandardMaterial({ color: 0x581c87 }));
    kDesk.position.set(0, 0.7, 1.2); kurtaShop.add(kDesk);

    // Mannequin Racks with Different Colored Kurtas
    const rackColors = [0xd97706, 0xdc2626, 0x0284c7, 0x059669, 0x9333ea];
    rackColors.forEach((col, idx) => {
      const manGroup = new THREE.Group();
      manGroup.position.set(-2 + idx * 1.0, 1.4, -0.4);
      // Mannequin Torso
      const mTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.8, 12), new THREE.MeshStandardMaterial({ color: col, roughness: 0.4 }));
      manGroup.add(mTorso);
      // Stand Pole
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.4), new THREE.MeshStandardMaterial({ color: 0xd4af37 }));
      pole.position.y = -0.7; manGroup.add(pole);
      kurtaShop.add(manGroup);
    });

    const kurtaBanner = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.5), new THREE.MeshBasicMaterial({ map: createBanner("👗 Free Kurta-Pyjama Boutique", '#6b21a8'), transparent: true }));
    kurtaBanner.position.set(0, 6.2, 0); kurtaShop.add(kurtaBanner);
    scene.add(kurtaShop);

    /* =========================================================================
       7. BOARDABLE JHOOLA (FERRIS WHEEL) & CAROUSEL
       ========================================================================= */
    const ferrisGroup = new THREE.Group();
    ferrisGroup.position.set(26, 0, 15);
    const supportMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8 });
    const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 16), supportMat);
    leg1.position.set(-2, 8, -2); leg1.rotation.z = -0.15; ferrisGroup.add(leg1);
    const leg2 = leg1.clone(); leg2.position.x = 2; leg2.rotation.z = 0.15; ferrisGroup.add(leg2);

    const wheelRotator = new THREE.Group();
    wheelRotator.position.set(0, 13.5, 0);
    const outerRing = new THREE.Mesh(new THREE.TorusGeometry(8, 0.16, 12, 32), new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xff8800 }));
    wheelRotator.add(outerRing);

    const ferrisGondolas = [];
    for (let i = 0; i < 8; i++) {
      const rad = (i * Math.PI * 2) / 8;
      const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 16), supportMat);
      spoke.rotation.z = rad; wheelRotator.add(spoke);

      const podGroup = new THREE.Group();
      podGroup.position.set(Math.cos(rad) * 8, Math.sin(rad) * 8, 0);

    // 4. Thrown Physics Sutli Bomb (Projectile)
    function launchThrownBomb(origin, forwardDirection) {
      const bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.8 }));
      bMesh.position.copy(origin);
      scene.add(bMesh);

      const cBody = new CANNON.Body({
        mass: 1.2,
        shape: new CANNON.Sphere(0.22),
        position: new CANNON.Vec3(origin.x, origin.y + 1.2, origin.z)
      });

      // Throw velocity forward & upward
      cBody.velocity.set(
        forwardDirection.x * 12 + (Math.random() - 0.5) * 2,
        6.5,
        forwardDirection.z * 12 + (Math.random() - 0.5) * 2
      );
      world.addBody(cBody);

      activeCrackers.push({
        type: 'bomb',
        mesh: bMesh,
        cBody: cBody,
        fuse: 70 // Explodes after fuse timer
      });
    }

    function updateCrackerPhysics() {
      for (let i = activeCrackers.length - 1; i >= 0; i--) {
        const c = activeCrackers[i];

        if (c.type === 'rocket') {
          if (c.fuel > 0) {
            c.cBody.applyForce(new CANNON.Vec3((Math.random() - 0.5) * 1.5, 13, (Math.random() - 0.5) * 1.5), c.cBody.position);
            c.fuel--;
            spawnSparks(new THREE.Vector3(c.cBody.position.x, c.cBody.position.y - 0.4, c.cBody.position.z), 4, 0xff7700, 0.1);
            c.light.position.copy(c.cBody.position);
          } else {
            spawnSparks(c.cBody.position, 140, 0xff2244, 0.85);
            spawnSparks(c.cBody.position, 120, 0xffea00, 0.75);
            const blast = new THREE.PointLight(0xffea00, 7, 30);
            blast.position.copy(c.cBody.position); scene.add(blast);
            setTimeout(() => scene.remove(blast), 160);

            world.remove(c.cBody); scene.remove(c.mesh); scene.remove(c.light);
            activeCrackers.splice(i, 1);
          }
          c.mesh.position.copy(c.cBody.position);
        } else if (c.type === 'chakri') {
          c.angle += 0.45; c.mesh.rotation.y = c.angle; c.life--;
          const px = c.mesh.position.x + Math.cos(c.angle) * 0.35;
          const pz = c.mesh.position.z + Math.sin(c.angle) * 0.35;
          spawnSparks(new THREE.Vector3(px, 0.08, pz), 6, 0x10b981, 0.35);
          if (c.life <= 0) { scene.remove(c.mesh); activeCrackers.splice(i, 1); }
        } else if (c.type === 'anar') {
          c.life--;
          const tip = new THREE.Vector3(c.mesh.position.x, c.mesh.position.y + 0.3, c.mesh.position.z);
          for (let s = 0; s < 7; s++) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffd700 }));
            mesh.position.copy(tip); scene.add(mesh);
            particles.push({ mesh, vel: new THREE.Vector3((Math.random() - 0.5) * 0.25, Math.random() * 0.55 + 0.25, (Math.random() - 0.5) * 0.25), life: 40, gravity: 0.016 });
          }
          if (c.life <= 0) { scene.remove(c.mesh); activeCrackers.splice(i, 1); }
        } else if (c.type === 'bomb') {
          c.fuse--;
          c.mesh.position.copy(c.cBody.position);
          c.mesh.quaternion.copy(c.cBody.quaternion);

          // Sizzling spark trail while flying
          spawnSparks(c.mesh.position, 2, 0xffea00, 0.05);

          if (c.fuse <= 0) {
            // Massive Detonation Burst
            spawnSparks(c.cBody.position, 160, 0xff3b30, 0.9);
            spawnSparks(c.cBody.position, 140, 0xffcc00, 0.8);
            const blast = new THREE.PointLight(0xffea00, 9, 35);
            blast.position.copy(c.cBody.position); scene.add(blast);
            setTimeout(() => scene.remove(blast), 180);

            world.remove(c.cBody); scene.remove(c.mesh);
            activeCrackers.splice(i, 1);
          }
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.mesh.position.add(p.vel);
        p.vel.y -= p.gravity;
        p.life--;
        if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
      }
    }

    let activeNearSpot = null;
    const joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0 };
    const joyContainer = document.getElementById('mobile-controls');
    const joyKnob = document.getElementById('joystick-knob');

    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      joyContainer.style.display = 'block';
    }

    joyContainer.addEventListener('pointerdown', (e) => {
      joystick.active = true;
      const rect = joyContainer.getBoundingClientRect();
      joystick.originX = rect.left + rect.width / 2;
      joystick.originY = rect.top + rect.height / 2;
      joyContainer.setPointerCapture(e.pointerId);
    });

    joyContainer.addEventListener('pointermove', (e) => {
      if (!joystick.active) return;
      const dx = e.clientX - joystick.originX;
      const dy = e.clientY - joystick.originY;
      const dist = Math.min(38, Math.hypot(dx, dy));
      const angle = Math.atan2(dy, dx);
      joystick.dx = (Math.cos(angle) * dist) / 38;
      joystick.dy = (Math.sin(angle) * dist) / 38;
      joyKnob.style.transform = `translate(${joystick.dx * 35}px, ${joystick.dy * 35}px)`;
    });
