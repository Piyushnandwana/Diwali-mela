<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shubh Diwali 3D Mela - Fully Interactive Carnival</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; background: #05020c; touch-action: none; }
    #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; inset: 0; }
    
    /* Top HUD */
    #hud {
      position: absolute; top: 16px; left: 16px; color: #ffdf79;
      background: linear-gradient(135deg, rgba(30, 10, 45, 0.92), rgba(12, 4, 20, 0.95));
      padding: 14px 20px; border-radius: 16px; border: 2px solid #ffd700;
      box-shadow: 0 8px 30px rgba(255, 170, 0, 0.35); pointer-events: none; z-index: 20;
    }
    #hud h2 { margin: 0 0 4px 0; font-size: 17px; color: #ffe682; letter-spacing: 1px; }
    #hud p { margin: 2px 0; font-size: 13px; color: #fff; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-weight: bold; background: #15803d; color: #bbf7d0; font-size: 11px; }

    /* Bottom Greeting Bar */
    #greeting-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; background: rgba(20, 8, 30, 0.94);
      padding: 8px 16px; border-radius: 40px; border: 2px solid #ffd700;
      box-shadow: 0 4px 30px rgba(255, 120, 0, 0.5); z-index: 20; max-width: 95vw; overflow-x: auto;
    }
    .greet-btn {
      background: linear-gradient(135deg, #d9530f, #ff7e26); color: #fff;
      border: 1px solid #ffe285; padding: 8px 14px; border-radius: 20px;
      font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.15s ease-in-out; white-space: nowrap;
    }
    .greet-btn:hover { transform: scale(1.06) translateY(-2px); background: linear-gradient(135deg, #ff7e26, #ffd000); color: #220500; }

    /* Touch Joystick for Mobile Movement */
    #mobile-controls {
      position: absolute; bottom: 85px; left: 24px; width: 110px; height: 110px;
      background: rgba(255, 255, 255, 0.12); border: 2px dashed rgba(255, 215, 0, 0.5);
      border-radius: 50%; z-index: 20; display: none; touch-action: none;
    }
    #joystick-knob {
      position: absolute; top: 32px; left: 32px; width: 46px; height: 46px;
      background: radial-gradient(circle, #ff8533 0%, #b91c1c 100%);
      border-radius: 50%; border: 2px solid #ffd700; box-shadow: 0 0 15px rgba(255, 120, 0, 0.8);
      pointer-events: none;
    }

    /* Interactive Action Prompt Banner */
    #interaction-prompt {
      position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(90deg, #b91c1c, #ea580c); color: #fff;
      padding: 10px 28px; font-size: 15px; font-weight: bold; border-radius: 30px;
      display: none; border: 2px solid #ffea79; box-shadow: 0 0 25px rgba(234, 88, 12, 0.8);
      z-index: 25; pointer-events: auto; cursor: pointer; text-align: center;
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.06); } }

    /* Dismount Ride Button */
    #dismount-btn {
      position: absolute; top: 85px; right: 20px;
      background: linear-gradient(135deg, #b91c1c, #ef4444); color: #fff;
      border: 2px solid #ffd700; padding: 12px 22px; border-radius: 30px;
      font-size: 14px; font-weight: bold; cursor: pointer; display: none; z-index: 30;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
    }
    #dismount-btn:hover { transform: scale(1.05); }

    /* Spawn / Entry Card */
    #spawn-screen {
      position: absolute; inset: 0; background: radial-gradient(circle, rgba(22,9,38,0.96) 0%, rgba(5,2,10,0.99) 100%);
      display: flex; justify-content: center; align-items: center; z-index: 200;
    }
    .spawn-card {
      background: linear-gradient(145deg, #2a1440, #140722); border: 2px solid #ffd700;
      border-radius: 20px; padding: 30px 24px; width: 340px; text-align: center; color: #fff;
      box-shadow: 0 0 50px rgba(255, 170, 0, 0.4);
    }
    .spawn-card input {
      width: 90%; padding: 10px; margin: 12px 0 18px 0; border-radius: 8px;
      border: 1px solid #ffd700; background: #0c0416; color: #fff; font-size: 15px; text-align: center;
    }
    .spawn-card button {
      background: linear-gradient(45deg, #ea580c, #f59e0b); color: #fff;
      border: none; padding: 11px 22px; border-radius: 8px; font-size: 15px;
      font-weight: bold; cursor: pointer; width: 95%;
    }

    /* Modal */
    .modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #1c0e30; color: #fff; border: 2px solid #ffd700;
      padding: 22px; border-radius: 16px; display: none; z-index: 100;
      box-shadow: 0 0 45px rgba(0,0,0,0.9); min-width: 300px; text-align: center;
    }
    .modal button {
      background: #ea580c; color: #fff; border: none; padding: 9px 16px;
      margin: 5px 4px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .modal button:hover { background: #f59e0b; color: #000; }
    .close-modal { background: #4b5563 !important; }
  </style>

  <!-- Three.js + Postprocessing + Physics -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Spawn Modal -->
  <div id="spawn-screen">
    <div class="spawn-card">
      <h2 style="color: #ffd700; margin-top: 0;">🪔 Shubh Diwali Mela</h2>
      <p style="font-size: 13px; color: #d1d5db;">Ride the giant Jhoola, ring temple bells, sit for chai, and burst physics crackers!</p>
      <input type="text" id="username-input" placeholder="Enter Your Name" maxlength="14" />
      <button onclick="joinMela()">Enter Grand Mela ✨</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <h2>🪔 SHUBH DIWALI MELA</h2>
    <p>👤 Player: <b id="display-name">-</b></p>
    <p>🟢 Live In Mela: <span class="badge" id="online-count">1 Online</span></p>
    <p>🪙 Coins: <span id="coin-count">100</span></p>
    <p>🎡 Ride State: <b id="ride-state" style="color:#ffd700;">On Foot</b></p>
    <p>🔄 <b>Swipe / Drag</b> to look around</p>
  </div>

  <!-- Exit Ride Button -->
  <button id="dismount-btn" onclick="dismountCurrentRide()">🚪 Dismount Ride (Exit Jhoola)</button>

  <!-- Mobile Movement Joystick -->
  <div id="mobile-controls">
    <div id="joystick-knob"></div>
  </div>

  <!-- Quick Greetings -->
  <div id="greeting-bar" style="display: none;">
    <button class="greet-btn" onclick="sendGreeting('🙏 Namaste!')">🙏 Namaste!</button>
    <button class="greet-btn" onclick="sendGreeting('🪔 Happy Diwali!')">🪔 Happy Diwali!</button>
    <button class="greet-btn" onclick="sendGreeting('🍬 Mithai Khao!')">🍬 Mithai Khao!</button>
    <button class="greet-btn" onclick="sendGreeting('✨ Ram Ram Ji!')">✨ Ram Ram Ji!</button>
  </div>

  <div id="interaction-prompt">Press [E] to Interact</div>

  <div id="action-modal" class="modal">
    <h3 id="modal-title" style="color:#ffd700; margin-top:0;">Action</h3>
    <div id="modal-body"></div>
    <br>
    <button class="close-modal" onclick="closeModal()">Close</button>
  </div>

  <script>
    /* =========================================================================
       1. CANNON-ES 3D PHYSICS WORLD
       ========================================================================= */
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);
    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    world.addBody(groundBody);

    /* =========================================================================
       2. THREE.JS SCENE SETUP & UNREAL BLOOM
       ========================================================================= */
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060210, 0.016);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const renderScene = new THREE.RenderPass(scene, camera);
    const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.8);
    const composer = new THREE.EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    scene.add(new THREE.AmbientLight(0x381f4a, 1.4));
    const moon = new THREE.DirectionalLight(0x758bb8, 0.7);
    moon.position.set(30, 60, 30);
    moon.castShadow = true;
    scene.add(moon);

    /* =========================================================================
       3. ORBIT CAMERA RIG
       ========================================================================= */
    const CameraOrbit = {
      theta: 0.78,
      phi: 0.65,
      radius: 17,
      isDragging: false,
      lastX: 0,
      lastY: 0
    };

    const container = document.getElementById('canvas-container');
    container.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#mobile-controls') || e.target.closest('#hud') || e.target.closest('#greeting-bar') || e.target.closest('#dismount-btn')) return;
      CameraOrbit.isDragging = true;
      CameraOrbit.lastX = e.clientX;
      CameraOrbit.lastY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!CameraOrbit.isDragging) return;
      const dx = e.clientX - CameraOrbit.lastX;
      const dy = e.clientY - CameraOrbit.lastY;
      CameraOrbit.lastX = e.clientX;
      CameraOrbit.lastY = e.clientY;

      CameraOrbit.theta -= dx * 0.007;
      CameraOrbit.phi = Math.max(0.15, Math.min(Math.PI / 2.1, CameraOrbit.phi + dy * 0.006));
    });

    window.addEventListener('pointerup', () => { CameraOrbit.isDragging = false; });
    window.addEventListener('pointercancel', () => { CameraOrbit.isDragging = false; });
    window.addEventListener('wheel', (e) => {
      CameraOrbit.radius = Math.max(7, Math.min(32, CameraOrbit.radius + e.deltaY * 0.02));
    }, { passive: true });

    /* =========================================================================
       4. FESTIVE ENVIRONMENT: GROUND, PATHS, DIYAS, RIDES
       ========================================================================= */
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(160, 160),
      new THREE.MeshStandardMaterial({ color: 0x160c22, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const pathMat = new THREE.MeshStandardMaterial({ color: 0x421d28, roughness: 0.7 });
    const mainPath = new THREE.Mesh(new THREE.PlaneGeometry(12, 120), pathMat);
    mainPath.rotation.x = -Math.PI / 2;
    mainPath.position.y = 0.02;
    scene.add(mainPath);

    const crossPath = new THREE.Mesh(new THREE.PlaneGeometry(120, 12), pathMat);
    crossPath.rotation.x = -Math.PI / 2;
    crossPath.position.y = 0.02;
    scene.add(crossPath);

    // Center Rangoli
    function createRangoliTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ff8800'; ctx.beginPath(); ctx.arc(256, 256, 240, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b91c1c'; ctx.beginPath(); ctx.arc(256, 256, 190, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(256, 256, 120, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(256, 256, 45, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 16; i++) {
        const rad = (i * Math.PI) / 8;
        ctx.fillStyle = '#10b981'; ctx.beginPath();
        ctx.arc(256 + Math.cos(rad) * 155, 256 + Math.sin(rad) * 155, 18, 0, Math.PI * 2); ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }
    const rangoli = new THREE.Mesh(
      new THREE.PlaneGeometry(14, 14),
      new THREE.MeshBasicMaterial({ map: createRangoliTexture(), transparent: true })
    );
    rangoli.rotation.x = -Math.PI / 2;
    rangoli.position.set(0, 0.05, 0);
    scene.add(rangoli);

    // Interactive Street Diyas
    const interactiveDiyas = [];
    for (let i = -35; i <= 35; i += 7) {
      if (Math.abs(i) > 6) {
        [[-6.5, i], [6.5, i], [i, -6.5], [i, 6.5]].forEach(([x, z]) => {
          const diya = new THREE.Group();
          diya.position.set(x, 0.06, z);
          const base = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.12, 0.14, 10), new THREE.MeshStandardMaterial({ color: 0x9a3412 }));
          diya.add(base);
          const flame = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
          flame.position.y = 0.14;
          diya.add(flame);
          const pl = new THREE.PointLight(0xff7700, 1.2, 7);
          pl.position.y = 0.25;
          diya.add(pl);
          scene.add(diya);
          interactiveDiyas.push({ group: diya, flame, pl, isLit: true, offset: Math.random() * 10 });
        });
      }
    }

    // Overhead Fairy Lights
    const fairyColors = [0xff2200, 0xffd700, 0x00ffcc, 0xff00aa, 0x00ff44];
    for (let z = -20; z <= 20; z += 10) {
      for (let x = -26; x <= 26; x += 3.5) {
        const bulb = new THREE.Mesh(
          new THREE.SphereGeometry(0.12, 8, 8),
          new THREE.MeshBasicMaterial({ color: fairyColors[Math.abs(x * 3 + z) % fairyColors.length] })
        );
        bulb.position.set(x, 6.2 + Math.sin(x * 0.25) * 0.5, z);
        scene.add(bulb);
      }
    }

    /* =========================================================================
       5. BOARDABLE FERRIS WHEEL (GIANT JHOOLA)
       ========================================================================= */
    const ferrisGroup = new THREE.Group();
    ferrisGroup.position.set(26, 0, 15);

    const supportMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8 });
    const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 16), supportMat);
    leg1.position.set(-2, 8, -2); leg1.rotation.z = -0.15; ferrisGroup.add(leg1);
    const leg2 = leg1.clone(); leg2.position.x = 2; leg2.rotation.z = 0.15; ferrisGroup.add(leg2);

    // Boarding Platform
    const boardPlatform = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 3), new THREE.MeshStandardMaterial({ color: 0x78350f }));
    boardPlatform.position.set(0, 0.6, 2.5);
    ferrisGroup.add(boardPlatform);

    const wheelRotator = new THREE.Group();
    wheelRotator.position.set(0, 13.5, 0);
    const outerRing = new THREE.Mesh(new THREE.TorusGeometry(8, 0.16, 12, 32), new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xff8800 }));
    wheelRotator.add(outerRing);

    const ferrisGondolas = [];
    for (let i = 0; i < 8; i++) {
      const rad = (i * Math.PI * 2) / 8;
      const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 16), supportMat);
      spoke.rotation.z = rad; wheelRotator.add(spoke);

      // Passenger Gondola Carriage with seat
      const podGroup = new THREE.Group();
      podGroup.position.set(Math.cos(rad) * 8, Math.sin(rad) * 8, 0);

      const podMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 1.6, 1.6),
        new THREE.MeshStandardMaterial({ color: fairyColors[i % fairyColors.length], roughness: 0.3 })
      );
      podGroup.add(podMesh);

      wheelRotator.add(podGroup);
      ferrisGondolas.push({ group: podGroup, baseAngle: rad });
    }
    ferrisGroup.add(wheelRotator);
    scene.add(ferrisGroup);

    /* =========================================================================
       6. BOARDABLE CAROUSEL (CHAKRI JHOOLA)
       ========================================================================= */
    const carouselGroup = new THREE.Group();
    carouselGroup.position.set(-26, 0, 15);
    const centerPole = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 7), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
    centerPole.position.y = 3.5; carouselGroup.add(centerPole);
    const cCanopy = new THREE.Mesh(new THREE.ConeGeometry(5.5, 2, 16), new THREE.MeshStandardMaterial({ color: 0xb91c1c }));
    cCanopy.position.y = 7; carouselGroup.add(cCanopy);

    const carouselSpinner = new THREE.Group();
    carouselSpinner.position.y = 3;
    const carouselSeats = [];

    for (let i = 0; i < 6; i++) {
      const rad = (i * Math.PI * 2) / 6;
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 3.5), supportMat);
      rod.position.set(Math.cos(rad) * 3.8, 1.75, Math.sin(rad) * 3.8);
      carouselSpinner.add(rod);

      const horse = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 1.2), new THREE.MeshStandardMaterial({ color: fairyColors[i % fairyColors.length] }));
      horse.position.set(Math.cos(rad) * 3.8, 0.8, Math.sin(rad) * 3.8);
      carouselSpinner.add(horse);
      carouselSeats.push(horse);
    }
    carouselGroup.add(carouselSpinner);
    scene.add(carouselGroup);

    /* =========================================================================
       7. INTERACTIVE CHAI & MITHAI TAPRI (WITH SEATING STOOLS)
       ========================================================================= */
    const chaiGroup = new THREE.Group();
    chaiGroup.position.set(18, 0, -5);

    // Stool 1 (Morha)
    const stool = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.6, 12), new THREE.MeshStandardMaterial({ color: 0x9a3412 }));
    stool.position.set(0, 0.3, 3);
    chaiGroup.add(stool);
    scene.add(chaiGroup);

    /* =========================================================================
       8. LAKSHMI TEMPLE WITH RINGABLE BELL (GHANTI) & AARTI
       ========================================================================= */
    const templeGroup = new THREE.Group();
    templeGroup.position.set(0, 0, -24);

    const plinth = new THREE.Mesh(new THREE.BoxGeometry(14, 1.2, 10), new THREE.MeshStandardMaterial({ color: 0xf5f3ef, roughness: 0.2 }));
    plinth.position.y = 0.6; templeGroup.add(plinth);

    const pMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.2 });
    for (let x of [-5, 5]) {
      for (let z of [-3.5, 3.5]) {
        const p = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.38, 6), pMat);
        p.position.set(x, 3.6, z); templeGroup.add(p);
      }
    }
    const dome = new THREE.Mesh(new THREE.ConeGeometry(5.5, 5.5, 8), new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.3 }));
    dome.position.y = 9; templeGroup.add(dome);

    // Hanging Temple Brass Bell (Ghanti)
    const bellGroup = new THREE.Group();
    bellGroup.position.set(0, 5.2, 0);
    const bellChain = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.4), pMat);
    bellChain.position.y = -0.7; bellGroup.add(bellChain);
    const bellBody = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.6, 16), pMat);
    bellBody.position.y = -1.5; bellGroup.add(bellBody);
    templeGroup.add(bellGroup);

    // Golden Lakshmi Idol
    const murtiGroup = new THREE.Group();
    murtiGroup.position.set(0, 2.2, -1);
    const idolMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.85, roughness: 0.15 });
    const lakshmiBody = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 1.8, 16), idolMat);
    murtiGroup.add(lakshmiBody);

    const halo = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.08, 12, 32), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
    halo.position.set(0, 1.2, -0.2); murtiGroup.add(halo);

    const redSari = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.82, 1.1, 16), new THREE.MeshStandardMaterial({ color: 0xcc1122, roughness: 0.4 }));
    redSari.position.y = -0.3; murtiGroup.add(redSari);
    templeGroup.add(murtiGroup);

    const mandirLight = new THREE.PointLight(0xffb700, 3, 20);
    mandirLight.position.set(0, 3.5, 0); templeGroup.add(mandirLight);
    scene.add(templeGroup);

    /* --- Aarti Thali & Marigold Shower --- */
    let aartiThali = null;
    let isDoingAarti = false;
    let aartiAngle = 0;
    let bellSwing = 0;

    function buildAartiThali() {
      const thali = new THREE.Group();
      const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.75, 0.08, 24), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 }));
      thali.add(plate);

      for (let i = 0; i < 5; i++) {
        const rad = (i * Math.PI * 2) / 5;
        const d = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.06, 0.1, 8), new THREE.MeshStandardMaterial({ color: 0x9a3412 }));
        d.position.set(Math.cos(rad) * 0.55, 0.08, Math.sin(rad) * 0.55);
        const f = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
        f.position.y = 0.08; d.add(f); thali.add(d);
      }
      thali.position.set(0, 2.5, -22); scene.add(thali);
      return thali;
    }

    const petals = [];
    function showerMarigoldPetals() {
      const cols = [0xff8800, 0xffbb00, 0xdc2626];
      for (let i = 0; i < 60; i++) {
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.15), new THREE.MeshBasicMaterial({ color: cols[i % cols.length], side: THREE.DoubleSide }));
        mesh.position.set((Math.random() - 0.5) * 3, 5 + Math.random() * 2, -24 + (Math.random() - 0.5) * 2.5);
        scene.add(mesh);
        petals.push({ mesh, vy: -0.03 - Math.random() * 0.03, rotSpeed: (Math.random() - 0.5) * 0.1, life: 180 });
      }
    }

    function updatePetals() {
      for (let i = petals.length - 1; i >= 0; i--) {
        const p = petals[i];
        p.mesh.position.y += p.vy;
        p.mesh.rotation.x += p.rotSpeed;
        p.mesh.rotation.y += p.rotSpeed;
        p.life--;
        if (p.mesh.position.y <= 1.2 || p.life <= 0) {
          scene.remove(p.mesh); petals.splice(i, 1);
        }
      }
    }

    /* =========================================================================
       9. REAL PHYSICS CRACKERS (Rockets, Chakris, Anars)
       ========================================================================= */
    const activeCrackers = [];
    const particles = [];

    function spawnSparks(pos, count = 40, color = 0xffa500, speed = 0.3) {
      for (let i = 0; i < count; i++) {
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), new THREE.MeshBasicMaterial({ color }));
        mesh.position.copy(pos); scene.add(mesh);
        const vel = new THREE.Vector3((Math.random() - 0.5) * speed, Math.random() * speed + 0.1, (Math.random() - 0.5) * speed);
        particles.push({ mesh, vel, life: 50, gravity: 0.012 });
      }
    }

    function launchPhysicsRocket(x, z) {
      const rGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8), new THREE.MeshStandardMaterial({ color: 0xdc2626 }));
      rGroup.add(body);
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 8), new THREE.MeshBasicMaterial({ color: 0xffd700 }));
      tip.position.y = 0.5; rGroup.add(tip); scene.add(rGroup);

      const cBody = new CANNON.Body({ mass: 0.4, shape: new CANNON.Cylinder(0.08, 0.08, 0.8, 8), position: new CANNON.Vec3(x, 0.5, z) });
      world.addBody(cBody);

      const light = new THREE.PointLight(0xff7700, 2, 8);
      scene.add(light);
      activeCrackers.push({ type: 'rocket', mesh: rGroup, cBody, fuel: 85, light });
    }

    function launchChakri(x, z) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.08, 16), new THREE.MeshStandardMaterial({ color: 0x10b981 }));
      mesh.position.set(x, 0.05, z); scene.add(mesh);
      activeCrackers.push({ type: 'chakri', mesh, life: 140, angle: 0 });
    }

    function launchAnar(x, z) {
      const mesh = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.6, 12), new THREE.MeshStandardMaterial({ color: 0xb45309 }));
      mesh.position.set(x, 0.3, z); scene.add(mesh);
      activeCrackers.push({ type: 'anar', mesh, life: 120 });
    }

    function updateCrackerPhysics() {
      for (let i = activeCrackers.length - 1; i >= 0; i--) {
        const c = activeCrackers[i];
        if (c.type === 'rocket') {
          if (c.fuel > 0) {
            c.cBody.applyForce(new CANNON.Vec3((Math.random() - 0.5) * 1.5, 13, (Math.random() - 0.5) * 1.5), c.cBody.position);
            c.fuel--;
            spawnSparks(new THREE.Vector3(c.cBody.position.x, c.cBody.position.y - 0.4, c.cBody.position.z), 4, 0xff7700, 0.1);
            c.light.position.copy(c.cBody.position);
          } else {
            spawnSparks(c.cBody.position, 140, 0xff2244, 0.85);
            spawnSparks(c.cBody.position, 120, 0xffea00, 0.75);
            const blast = new THREE.PointLight(0xffea00, 7, 30);
            blast.position.copy(c.cBody.position); scene.add(blast);
            setTimeout(() => scene.remove(blast), 160);

            world.remove(c.cBody); scene.remove(c.mesh); scene.remove(c.light);
            activeCrackers.splice(i, 1);
          }
          c.mesh.position.copy(c.cBody.position);
        } else if (c.type === 'chakri') {
          c.angle += 0.45; c.mesh.rotation.y = c.angle; c.life--;
          const px = c.mesh.position.x + Math.cos(c.angle) * 0.35;
          const pz = c.mesh.position.z + Math.sin(c.angle) * 0.35;
          spawnSparks(new THREE.Vector3(px, 0.08, pz), 6, 0x10b981, 0.35);
          if (c.life <= 0) { scene.remove(c.mesh); activeCrackers.splice(i, 1); }
        } else if (c.type === 'anar') {
          c.life--;
          const tip = new THREE.Vector3(c.mesh.position.x, c.mesh.position.y + 0.3, c.mesh.position.z);
          for (let s = 0; s < 7; s++) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffd700 }));
            mesh.position.copy(tip); scene.add(mesh);
            particles.push({ mesh, vel: new THREE.Vector3((Math.random() - 0.5) * 0.25, Math.random() * 0.55 + 0.25, (Math.random() - 0.5) * 0.25), life: 40, gravity: 0.016 });
          }
          if (c.life <= 0) { scene.remove(c.mesh); activeCrackers.splice(i, 1); }
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.mesh.position.add(p.vel);
        p.vel.y -= p.gravity;
        p.life--;
        if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
      }
    }

    function createNameplate(text) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgba(12, 5, 24, 0.88)';
      ctx.beginPath(); ctx.roundRect(10, 8, 236, 48, 16); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#ffd700'; ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px Segoe UI, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 32);

      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
      sprite.scale.set(3, 0.75, 1);
      sprite.position.y = 3.3;
      return sprite;
    }

    function buildArticulatedAvatar(name) {
      const group = new THREE.Group();
      const limbs = {};

      const skinMat = new THREE.MeshStandardMaterial({ color: 0xdfa07a, roughness: 0.6 });
      const kurtaMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
      const pyjamaMat = new THREE.MeshStandardMaterial({ color: 0xfdfcf7, roughness: 0.6 });
      const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });

      // Torso
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.44, 1.28, 16), kurtaMat);
      torso.position.y = 1.45; torso.castShadow = true; group.add(torso);
      limbs.torso = torso;

      // Angavastram Sash
      const sash = new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.08, 8, 24), goldMat);
      sash.position.set(0, 1.48, 0); sash.rotation.x = Math.PI / 4; sash.rotation.y = Math.PI / 5; group.add(sash);

      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 16), skinMat);
      head.position.y = 2.25; group.add(head);

      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), eyeMat);
      eyeL.position.set(-0.08, 2.28, 0.24); group.add(eyeL);
      const eyeR = eyeL.clone(); eyeR.position.x = 0.08; group.add(eyeR);

      const tilak = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.09, 0.02), new THREE.MeshBasicMaterial({ color: 0xdc2626 }));
      tilak.position.set(0, 2.36, 0.26); group.add(tilak);

      const pagri = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.12, 12, 24), new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.4 }));
      pagri.position.y = 2.45; pagri.rotation.x = Math.PI / 2; group.add(pagri);
      const kalgi = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.25, 8), goldMat);
      kalgi.position.set(0, 2.7, 0.22); group.add(kalgi);

      // Limbs
      function createArm(isLeft) {
        const shoulderPivot = new THREE.Group();
        shoulderPivot.position.set(isLeft ? -0.48 : 0.48, 1.9, 0);
        const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.72, 12), kurtaMat);
        upperArm.position.y = -0.36;
        shoulderPivot.add(upperArm);
        group.add(shoulderPivot);
        return shoulderPivot;
      }
      limbs.armL = createArm(true);
      limbs.armR = createArm(false);

      function createLeg(isLeft) {
        const hipPivot = new THREE.Group();
        hipPivot.position.set(isLeft ? -0.22 : 0.22, 0.88, 0);
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 0.88, 12), pyjamaMat);
        leg.position.y = -0.44;
        hipPivot.add(leg);
        group.add(hipPivot);
        return hipPivot;
      }
      limbs.legL = createLeg(true);
      limbs.legR = createLeg(false);

      group.add(createNameplate(name));
      return { group, limbs };
    }

    const joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0 };
    const joyContainer = document.getElementById('mobile-controls');

    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      joyContainer.style.display = 'block';
    }

    joyContainer.addEventListener('pointerdown', (e) => {
      joystick.active = true;
      const rect = joyContainer.getBoundingClientRect();
      joystick.originX = rect.left + rect.width / 2;
      joystick.originY = rect.top + rect.height / 2;
      joyContainer.setPointerCapture(e.pointerId);
    });

    joyContainer.addEventListener('pointermove', (e) => {
      if (!joystick.active) return;
      const dx = e.clientX - joystick.originX;
      const dy = e.clientY - joystick.originY;
      const dist = Math.min(38, Math.hypot(dx, dy));
      const angle = Math.atan2(dy, dx);

      joystick.dx = (Math.cos(angle) * dist) / 38;
      joystick.dy = (Math.sin(angle) * dist) / 38;
      joyKnob.style.transform = `translate(${joystick.dx * 35}px, ${joystick.dy * 35}px)`;
    });

    const resetJoystick = () => {
      joystick.active = false;
      joystick.dx = 0; joystick.dy = 0;
      joyKnob.style.transform = `translate(0px, 0px)`;
    };
    joyContainer.addEventListener('pointerup', resetJoystick);
    joyContainer.addEventListener('pointercancel', resetJoystick);

    const clock = new THREE.Clock();

    /* =========================================================================
       13. MAIN RENDER LOOP & RIDE ANIMATIONS
       ========================================================================= */
    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      world.step(1 / 60, delta, 3);
      const time = clock.getElapsedTime();

      // Spin Wheels
      wheelRotator.rotation.z += 0.008;
      carouselSpinner.rotation.y += 0.015;

      // Keep Ferris gondolas swinging upright
      ferrisGondolas.forEach(g => {
        g.group.rotation.z = -wheelRotator.rotation.z;
      });

      // Bell Swinging Physics
      if (bellSwing > 0.01) {
        bellGroup.rotation.z = Math.sin(time * 15) * bellSwing;
        bellSwing *= 0.96; // damping
      } else {
        bellGroup.rotation.z = 0;
      }

      // Diya flicker
      interactiveDiyas.forEach(d => {
        const flicker = Math.sin(time * 8 + d.offset) * 0.15 + 0.95;
        d.flame.scale.set(flicker, flicker * 1.2, flicker);
        d.pl.intensity = 1.2 * flicker;
      });

      if (LocalPlayer.meshGroup) {
        // RIDE POSITION ATTACHMENT
        if (LocalPlayer.currentRide === 'ferris') {
          // Calculate world position of current gondola
          const targetGondola = ferrisGondolas[LocalPlayer.rideIndex].group;
          const gondolaWorldPos = new THREE.Vector3();
          targetGondola.getWorldPosition(gondolaWorldPos);

          LocalPlayer.meshGroup.position.copy(gondolaWorldPos);
          LocalPlayer.meshGroup.position.y -= 0.4;
          LocalPlayer.meshGroup.rotation.y = 0;
        } else if (LocalPlayer.currentRide === 'carousel') {
          const seat = carouselSeats[0];
          const seatWorldPos = new THREE.Vector3();
          seat.getWorldPosition(seatWorldPos);

          LocalPlayer.meshGroup.position.copy(seatWorldPos);
          LocalPlayer.meshGroup.position.y += 0.1;
          LocalPlayer.meshGroup.rotation.y = carouselSpinner.rotation.y + Math.PI / 2;
        } else if (LocalPlayer.currentRide === null) {
          // ON-FOOT MOVEMENT
          const speed = 0.18;
          let inputX = 0; let inputZ = 0;

          if (keys['w'] || keys['arrowup'])    inputZ -= 1;
          if (keys['s'] || keys['arrowdown'])  inputZ += 1;
          if (keys['a'] || keys['arrowleft'])  inputX -= 1;
          if (keys['d'] || keys['arrowright']) inputX += 1;

          if (joystick.active) {
            inputX += joystick.dx;
            inputZ += joystick.dy;
          }

          const isMoving = Math.hypot(inputX, inputZ) > 0.1;

          if (isMoving) {
            const forward = new THREE.Vector3(-Math.sin(CameraOrbit.theta), 0, -Math.cos(CameraOrbit.theta)).normalize();
            const right = new THREE.Vector3(Math.cos(CameraOrbit.theta), 0, -Math.sin(CameraOrbit.theta)).normalize();

            const moveVec = new THREE.Vector3().addScaledVector(forward, -inputZ).addScaledVector(right, inputX).normalize();
            LocalPlayer.meshGroup.position.addScaledVector(moveVec, speed);

            const targetRot = Math.atan2(moveVec.x, moveVec.z);
            LocalPlayer.meshGroup.rotation.y = THREE.MathUtils.lerp(LocalPlayer.meshGroup.rotation.y, targetRot, 0.2);

            LocalPlayer.walkCycle += 0.22;
            const legSwing = Math.sin(LocalPlayer.walkCycle) * 0.65;
            LocalPlayer.limbs.legL.rotation.x = legSwing;
            LocalPlayer.limbs.legR.rotation.x = -legSwing;
            LocalPlayer.limbs.armL.rotation.x = -legSwing * 0.8;
            LocalPlayer.limbs.armR.rotation.x = legSwing * 0.8;

            LocalPlayer.limbs.torso.position.y = 1.45 + Math.abs(Math.sin(LocalPlayer.walkCycle * 2)) * 0.05;
          } else {
            LocalPlayer.breathCycle += 0.04;
            const breath = Math.sin(LocalPlayer.breathCycle) * 0.03;
            LocalPlayer.limbs.legL.rotation.x = THREE.MathUtils.lerp(LocalPlayer.limbs.legL.rotation.x, 0, 0.15);
            LocalPlayer.limbs.legR.rotation.x = THREE.MathUtils.lerp(LocalPlayer.limbs.legR.rotation.x, 0, 0.15);
            LocalPlayer.limbs.armL.rotation.x = THREE.MathUtils.lerp(LocalPlayer.limbs.armL.rotation.x, breath, 0.1);
            LocalPlayer.limbs.armR.rotation.x = THREE.MathUtils.lerp(LocalPlayer.limbs.armR.rotation.x, -breath, 0.1);
            LocalPlayer.limbs.torso.position.y = 1.45 + breath * 0.5;
          }

          // Hotspot Proximity Detection
          let near = null;
          HOTSPOTS.forEach(h => {
            if (LocalPlayer.meshGroup.position.distanceTo(new THREE.Vector3(...h.pos)) <= h.range) near = h;
          });

          const prompt = document.getElementById('interaction-prompt');
          if (near) {
            activeNearSpot = near;
            prompt.style.display = 'block';
            prompt.innerText = `Tap or Press [E] for ${near.name}`;
          } else {
            activeNearSpot = null;
            prompt.style.display = 'none';
          }
        }

        // Camera Follows Avatar (Even high up on the Ferris wheel)
        const camX = LocalPlayer.meshGroup.position.x + CameraOrbit.radius * Math.sin(CameraOrbit.phi) * Math.sin(CameraOrbit.theta);
        const camY = LocalPlayer.meshGroup.position.y + CameraOrbit.radius * Math.cos(CameraOrbit.phi);
        const camZ = LocalPlayer.meshGroup.position.z + CameraOrbit.radius * Math.sin(CameraOrbit.phi) * Math.cos(CameraOrbit.theta);

        camera.position.set(camX, camY, camZ);
        camera.lookAt(LocalPlayer.meshGroup.position.x, LocalPlayer.meshGroup.position.y + 1.4, LocalPlayer.meshGroup.position.z);
      }

      // Aarti 360 Rotation
      if (isDoingAarti && aartiThali) {
        aartiAngle += 0.04;
        aartiThali.position.x = Math.cos(aartiAngle) * 1.5;
        aartiThali.position.y = 2.5 + Math.sin(aartiAngle) * 0.5;
        aartiThali.rotation.z = Math.cos(aartiAngle) * 0.15;
        if (aartiAngle >= Math.PI * 4) {
          isDoingAarti = false;
          scene.remove(aartiThali);
          aartiThali = null;
        }
      }

      updatePetals();
      updateCrackerPhysics();
      composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
