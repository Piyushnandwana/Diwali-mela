<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Multiplayer 3D Diwali Mela</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; background: #050510; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    /* HUD Overlays */
    #hud {
      position: absolute; top: 15px; left: 15px; color: #ffdf79;
      background: rgba(15, 10, 25, 0.85); padding: 14px 22px;
      border-radius: 12px; border: 1px solid #d4af37; pointer-events: none;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
    }
    #hud h2 { margin: 0 0 5px 0; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
    #hud p { margin: 3px 0; font-size: 14px; color: #fff; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-weight: bold; background: #166534; color: #86efac; }

    /* Greeting Bar */
    #greeting-bar {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; background: rgba(20, 10, 30, 0.9);
      padding: 10px 18px; border-radius: 30px; border: 2px solid #d4af37;
      box-shadow: 0 4px 25px rgba(212, 175, 55, 0.35); z-index: 10;
    }
    .greet-btn {
      background: linear-gradient(135deg, #e65c00, #ff8533); color: #fff;
      border: 1px solid #ffd700; padding: 8px 14px; border-radius: 20px;
      font-size: 14px; font-weight: bold; cursor: pointer; transition: transform 0.15s, background 0.15s;
    }
    .greet-btn:hover { transform: scale(1.08); background: linear-gradient(135deg, #ff8533, #ffd700); }

    /* Login / Join Modal */
    #spawn-screen {
      position: absolute; inset: 0; background: rgba(5, 5, 15, 0.95);
      display: flex; justify-content: center; align-items: center; z-index: 200;
    }
    .spawn-card {
      background: #1a0f2e; border: 2px solid #d4af37; border-radius: 16px;
      padding: 30px; width: 340px; text-align: center; color: #fff;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.4);
    }
    .spawn-card h2 { color: #ffd700; margin-top: 0; }
    .spawn-card input {
      width: 85%; padding: 10px; margin: 12px 0; border-radius: 8px;
      border: 1px solid #d4af37; background: #0d0617; color: #fff; font-size: 15px;
    }
    .spawn-card button {
      background: linear-gradient(45deg, #e65c00, #ff8533); color: #fff;
      border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px;
      font-weight: bold; cursor: pointer; width: 92%;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Join Screen -->
  <div id="spawn-screen">
    <div class="spawn-card">
      <h2>🪔 Join Diwali Mela</h2>
      <p style="font-size: 13px; color: #bbb;">Choose your festive name and join everyone live in the bazaar!</p>
      <input type="text" id="username-input" placeholder="Enter your name (e.g. Rahul)" maxlength="14" />
      <br>
      <button onclick="joinMela()">Enter the Mela ✨</button>
    </div>
  </div>

  <!-- Live Stats HUD -->
  <div id="hud">
    <h2>🪔 Shubh Diwali Mela</h2>
    <p>👤 Player: <b id="display-name">-</b></p>
    <p>🟢 Live In Mela: <span class="badge" id="online-count">1 Online</span></p>
    <p>🪙 Coins: <span id="coin-count">100</span></p>
    <p>🕹️ Movement: <b>W, A, S, D</b> or <b>Arrow Keys</b></p>
  </div>

  <!-- Interactive Greeting Bar -->
  <div id="greeting-bar" style="display: none;">
    <button class="greet-btn" onclick="sendGreeting('🙏 Namaste!')">🙏 Namaste!</button>
    <button class="greet-btn" onclick="sendGreeting('🪔 Happy Diwali!')">🪔 Happy Diwali!</button>
    <button class="greet-btn" onclick="sendGreeting('🍬 Mithai Khao!')">🍬 Mithai Khao!</button>
    <button class="greet-btn" onclick="sendGreeting('✨ Ram Ram Ji!')">✨ Ram Ram Ji!</button>
  </div>

  <script>
    const LocalPlayer = {
      id: "user_" + Math.floor(Math.random() * 100000),
      name: "Guest",
      color: 0xd4af37,
      coins: 100,
      pos: { x: 0, y: 0, z: 10 },
      rotY: 0,
      group: null,
      bubbleSprite: null,
      bubbleTimeout: null
    };

    const RemotePlayers = {};

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0515, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x221133, 1.2));
    const moon = new THREE.DirectionalLight(0x6688cc, 0.6);
    moon.position.set(20, 50, 20);
    scene.add(moon);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 120),
      new THREE.MeshStandardMaterial({ color: 0x1f1424, roughness: 0.85 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const centerLight = new THREE.PointLight(0xff9900, 2.5, 45);
    centerLight.position.set(0, 7, 0);
    scene.add(centerLight);

    /* --- Billboard Nameplate Generator --- */
    function createNameplate(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(10, 5, 20, 0.8)';
      ctx.beginPath();
      ctx.roundRect(10, 10, 236, 44, 15);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffd700';
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 32);

      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
      sprite.scale.set(3, 0.75, 1);
      sprite.position.y = 2.8;
      return sprite;
    }

    /* --- Speech / Greeting Bubble Generator --- */
    function createBubbleSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 320; canvas.height = 96;
      const ctx = canvas.getContext('2d');

      // Speech bubble rounded rect with bottom pointer
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(10, 8, 300, 60, 20);
      ctx.fill();

      // Tail
      ctx.beginPath();
      ctx.moveTo(150, 68);
      ctx.lineTo(160, 86);
      ctx.lineTo(170, 68);
      ctx.fill();

      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ff8533';
      ctx.stroke();

      // Greeting Text
      ctx.fillStyle = '#1a0f2e';
      ctx.font = 'bold 26px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 160, 38);

      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
      sprite.scale.set(3.8, 1.15, 1);
      sprite.position.y = 3.8;
      return sprite;
    }

    /* --- Avatar Builder --- */
    function buildAvatarMesh(name, colorHex) {
      const group = new THREE.Group();

      const kurtaMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 1.3, 16), kurtaMat);
      body.position.y = 1.1;
      group.add(body);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), new THREE.MeshStandardMaterial({ color: 0xdfa07a }));
      head.position.y = 2.0;
      group.add(head);

      const pagri = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.1, 10, 20), new THREE.MeshStandardMaterial({ color: 0xcc2200 }));
      pagri.position.y = 2.15;
      pagri.rotation.x = Math.PI / 2;
      group.add(pagri);

      const nameplate = createNameplate(name);
      group.add(nameplate);

      return group;
    }

    /* --- Displays greeting speech bubble on avatar --- */
    function showPlayerGreeting(targetData, text) {
      if (targetData.bubbleSprite) {
        targetData.group.remove(targetData.bubbleSprite);
        clearTimeout(targetData.bubbleTimeout);
      }
      const bubble = createBubbleSprite(text);
      targetData.group.add(bubble);
      targetData.bubbleSprite = bubble;

      // Auto-hide bubble after 4 seconds
      targetData.bubbleTimeout = setTimeout(() => {
        if (targetData.bubbleSprite) {
          targetData.group.remove(targetData.bubbleSprite);
          targetData.bubbleSprite = null;
        }
      }, 4000);
    }

    /* --- Broadcast Channel Sync --- */
    const channel = new BroadcastChannel('diwali_mela_room');

    function joinMela() {
      const input = document.getElementById('username-input');
      const name = input.value.trim() || ("User" + Math.floor(Math.random() * 900 + 100));
      LocalPlayer.name = name;

      document.getElementById('display-name').innerText = name;
      document.getElementById('spawn-screen').style.display = 'none';
      document.getElementById('greeting-bar').style.display = 'flex';

      LocalPlayer.group = buildAvatarMesh(LocalPlayer.name, LocalPlayer.color);
      LocalPlayer.group.position.set(LocalPlayer.pos.x, 0, LocalPlayer.pos.z);
      scene.add(LocalPlayer.group);

      initMultiplayerSync();
    }

    window.sendGreeting = (greetingText) => {
      // 1. Show above local avatar
      showPlayerGreeting(LocalPlayer, greetingText);

      // 2. Broadcast greeting event to other players
      channel.postMessage({
        type: 'greet',
        playerId: LocalPlayer.id,
        greeting: greetingText
      });
    };

    function initMultiplayerSync() {
      broadcastState('join');

      channel.onmessage = (event) => {
        const { type, player, playerId, greeting } = event.data;

        // Remote player greeting event
        if (type === 'greet' && RemotePlayers[playerId]) {
          showPlayerGreeting(RemotePlayers[playerId], greeting);
          return;
        }

        if (!player || player.id === LocalPlayer.id) return;

        if (type === 'join' || type === 'update') {
          if (!RemotePlayers[player.id]) {
            const group = buildAvatarMesh(player.name, player.color);
            scene.add(group);
            RemotePlayers[player.id] = { ...player, group, bubbleSprite: null, bubbleTimeout: null };
            updateOnlineCounter();
          }
          RemotePlayers[player.id].group.position.set(player.pos.x, 0, player.pos.z);
          RemotePlayers[player.id].group.rotation.y = player.rotY;
        } else if (type === 'leave') {
          if (RemotePlayers[player.id]) {
            scene.remove(RemotePlayers[player.id].group);
            delete RemotePlayers[player.id];
            updateOnlineCounter();
          }
        }
      };

      setInterval(() => {
        if (LocalPlayer.group) {
          LocalPlayer.pos.x = LocalPlayer.group.position.x;
          LocalPlayer.pos.z = LocalPlayer.group.position.z;
          LocalPlayer.rotY = LocalPlayer.group.rotation.y;
          broadcastState('update');
        }
      }, 50);

      window.addEventListener('beforeunload', () => broadcastState('leave'));
    }

    function broadcastState(type) {
      channel.postMessage({
        type: type,
        player: {
          id: LocalPlayer.id,
          name: LocalPlayer.name,
          color: LocalPlayer.color,
          pos: LocalPlayer.pos,
          rotY: LocalPlayer.rotY
        }
      });
    }

    function updateOnlineCounter() {
      const count = Object.keys(RemotePlayers).length + 1;
      document.getElementById('online-count').innerText = `${count} Online`;
    }

    /* --- Movement & Render Loop --- */
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function animate() {
      requestAnimationFrame(animate);

      if (LocalPlayer.group) {
        const speed = 0.18;
        if (keys['w'] || keys['arrowup'])    { LocalPlayer.group.position.z -= speed; LocalPlayer.group.rotation.y = Math.PI; }
        if (keys['s'] || keys['arrowdown'])  { LocalPlayer.group.position.z += speed; LocalPlayer.group.rotation.y = 0; }
        if (keys['a'] || keys['arrowleft'])  { LocalPlayer.group.position.x -= speed; LocalPlayer.group.rotation.y = -Math.PI / 2; }
        if (keys['d'] || keys['arrowright']) { LocalPlayer.group.position.x += speed; LocalPlayer.group.rotation.y = Math.PI / 2; }

        camera.position.x = THREE.MathUtils.lerp(camera.position.x, LocalPlayer.group.position.x, 0.08);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, LocalPlayer.group.position.y + 7, 0.08);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, LocalPlayer.group.position.z + 12, 0.08);
        camera.lookAt(LocalPlayer.group.position.x, LocalPlayer.group.position.y + 1.2, LocalPlayer.group.position.z);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
